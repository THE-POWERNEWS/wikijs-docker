# Wiki.js + PostgreSQL（検索は Wiki.js 内蔵の Database エンジンを使う）
#
# ⚠ 上流（kshinoapp/wikijs-docker-compose-ja）との差分:
#   - Elasticsearch（`search` サービスと `wikijsindex` volume）を削除した。
#     日本語検索のために置かれていたが、運用側で索引が作られておらず
#     検索が無言で何も返さない状態が続いた。ページ数の少ない wiki では
#     ES の常駐コスト（heap 2GB）に見合わないため、Wiki.js 内蔵の
#     Database (Basic) エンジンへ切り替えた。
#   - イメージのタグを固定した。`:2` のような動くタグのままだと、
#     provisioning が `docker compose pull` を持った時点で、宣言を変えて
#     いないのにメジャー／マイナーが勝手に上がりうる。**版を上げるのは
#     このファイルの変更として行う。**
#
# ⚠ postgres:11-alpine は PostgreSQL 11（2023-11 EOL）。版の引き上げは
#   dump / restore を伴うので別作業として扱う。
services:
  db:
    image: postgres:11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikijsuser}
      POSTGRES_USER: ${POSTGRES_USER:-wikijs}
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data

  wiki:
    image: requarks/wiki:2.5.314
    depends_on:
      - db
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-wikijs}
      DB_PASS: ${POSTGRES_PASSWORD:-wikijsuser}
      DB_NAME: ${POSTGRES_DB:-wiki}
    restart: unless-stopped
    ports:
      - "8090:3000"

volumes:
  db-data:
